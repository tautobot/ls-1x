[tool.poetry]
name = "ls-1x"
version = "0.1.0"
description = "ls-1x site"
authors = ["Trieu Truong"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
schedule = "^1.2.1"
streamlit = "^1.34.0"
python-dotenv = "^1.0.1"
extra-streamlit-components = "^0.1.71"
itables = "^2.2.1"
filelock = "^3.13"
httpx = "^0.28.1"
structlog = "^26.1.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.15.0"
tenacity = "^9.1.4"
streamlit-autorefresh = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[theme]
base="dark"
